<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>AI老婆聊天室 · 玩家创建·管理员调度</title>
  <style>
    :root {
      --bg: #1a1d23;
      --surface: #22252e;
      --surface-light: #2a2d37;
      --primary: #6c8cff;
      --primary-soft: #4a5fcf;
      --danger: #e0556a;
      --text: #e8e9ef;
      --text-secondary: #9a9da8;
      --bubble-user: #2f3b54;
      --bubble-ai: #3c1e4a;
      --border: #363a45;
      --radius: 16px;
      --radius-xs: 8px;
      --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      height: 100vh; width: 100vw; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
    .screen.active { display: flex; }

    .auth-box {
      background: var(--surface); border-radius: var(--radius);
      padding: 2.5rem 2rem; width: 90%; max-width: 400px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; gap: 1.2rem; margin: auto;
    }
    .auth-box h2 { font-size: 1.6rem; text-align: center; color: #fff; }
    .auth-box input {
      width: 100%; padding: 0.85rem; border-radius: var(--radius-xs);
      border: 1.5px solid var(--border); background: var(--surface-light);
      color: var(--text); font-size: 0.95rem; outline: none;
    }
    .auth-box input:focus { border-color: var(--primary); }
    .btn {
      padding: 0.85rem; border: none; border-radius: var(--radius-xs);
      font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s;
      letter-spacing: 0.3px; font-family: var(--font);
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-soft); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--surface-light); }
    .link-text { color: var(--primary); cursor: pointer; font-weight: 500; }
    .error-msg { color: var(--danger); font-size: 0.8rem; text-align: center; min-height: 1rem; }

    .chat-layout { flex: 1; display: flex; overflow: hidden; position: relative; }
    .main-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .top-bar {
      padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; background: var(--surface);
      cursor: default;
    }
    .top-bar .room-title { font-weight: 700; font-size: 1.1rem; flex: 1; }
    .online-count { font-size: 0.8rem; color: var(--text-secondary); background: var(--surface-light); padding: 2px 10px; border-radius: 20px; }
    .connection-status {
      font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
      background: #ff9800; color: #fff; margin-left: 4px;
    }
    .connection-status.online { background: #4caf50; }
    .connection-status.offline { background: #e0556a; }

    .right-panels {
      display: flex; flex-direction: column; width: 300px; min-width: 300px;
      border-left: 1px solid var(--border); background: var(--surface-light);
      transition: transform 0.3s ease; z-index: 20;
    }
    @media (max-width: 768px) {
      .right-panels {
        position: absolute; right: 0; top: 0; bottom: 0;
        transform: translateX(100%); box-shadow: -8px 0 20px rgba(0,0,0,0.5);
      }
      .right-panels.open { transform: translateX(0); }
    }

    .panel-section {
      padding: 1rem; border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child { border-bottom: none; flex: 1; overflow-y: auto; }

    .role-list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem;
    }
    .call-btn {
      background: var(--primary); color: #fff; border: none;
      border-radius: 12px; padding: 2px 10px; cursor: pointer; font-size: 0.7rem;
    }

    .messages-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .message { display: flex; gap: 8px; max-width: 85%; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai { align-self: flex-start; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem;
      color: #fff; flex-shrink: 0;
    }
    .message.user .avatar { background: #4a5fcf; }
    .message.ai .avatar { background: #e0557a; }
    .bubble {
      padding: 0.7rem 1rem; border-radius: 18px; font-size: 0.92rem;
      line-height: 1.5; word-break: break-word;
      background: var(--bubble-user); color: #dfe3f0;
    }
    .message.ai .bubble { background: var(--bubble-ai); color: #f8e0ff; }
    .meta { font-size: 0.65rem; color: var(--text-secondary); margin: 0 0.2rem; display: flex; gap: 6px; align-items: center; }
    .message.user .meta { justify-content: flex-end; }
    .typing-indicator { font-size: 0.8rem; color: var(--text-secondary); font-style: italic; padding: 0.5rem; }

    .input-area { padding: 0.8rem 1rem; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--surface); }
    .input-area textarea {
      flex: 1; background: var(--surface-light); border: 1.5px solid var(--border);
      border-radius: 24px; padding: 0.65rem 1.2rem; color: var(--text);
      font-size: 0.9rem; resize: none; outline: none; max-height: 110px; font-family: var(--font);
    }
    .input-area textarea:focus { border-color: var(--primary); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%; background: var(--primary);
      border: none; color: #fff; font-size: 1.2rem; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .send-btn:hover { background: var(--primary-soft); }
    .send-btn:disabled { background: #444; cursor: not-allowed; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 50;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--surface); border-radius: var(--radius); padding: 2rem;
      width: 90%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    }
    .modal-box h3 { font-size: 1.2rem; color: #fff; }
    .model-row { display: flex; gap: 0.5rem; align-items: flex-end; }
    .model-row select { flex: 1; }

    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 0.7rem 1.5rem; border-radius: 20px;
      font-size: 0.85rem; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toggle-btn {
      background: var(--primary); color: #fff; border: none; border-radius: 6px 0 0 6px;
      padding: 8px 4px; cursor: pointer; font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="screen active" id="authScreen">
    <div class="auth-box">
      <h2>💖 AI老婆聊天室</h2>
      <p style="text-align:center; color:var(--text-secondary);">创建专属AI · 管理员统一调度</p>
      <input type="text" id="usernameInput" placeholder="用户名" maxlength="15">
      <input type="password" id="passwordInput" placeholder="密码" maxlength="30">
      <div class="error-msg" id="authError"></div>
      <button class="btn btn-primary" id="loginBtn">登 录</button>
      <button class="btn btn-outline" id="registerBtn">注 册</button>
      <div style="text-align:center; font-size:0.85rem;">
        没有账号？<span class="link-text" id="toggleToRegister">立即注册</span>
      </div>
    </div>
  </div>

  <div class="screen" id="chatScreen">
    <div class="chat-layout">
      <div class="main-panel">
        <div class="top-bar" id="topBar">
          <span class="room-title">🌐 AI老婆聊天室</span>
          <span class="connection-status online" id="connectionStatus">🟢 已连接</span>
          <span class="online-count" id="onlineCount">🟢 在线</span>
          <button class="btn-small" id="togglePanelBtn" style="display:none;">👥</button>
          <button class="btn-small" id="logoutBtn">🚪</button>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
          <textarea id="messageInput" rows="1" placeholder="输入消息，@AI名字召唤老婆~" maxlength="800"></textarea>
          <button class="send-btn" id="sendBtn">➤</button>
        </div>
      </div>
      <div class="right-panels" id="rightPanels">
        <div class="panel-section">
          <h3>💖 我的AI</h3>
          <input type="text" id="myRoleName" placeholder="角色名" maxlength="10" style="width:100%; margin:0.5rem 0; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.5rem; color:var(--text);">
          <textarea id="myRolePersona" rows="2" placeholder="人设" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.5rem; color:var(--text); resize:vertical;"></textarea>
          <button class="btn-small" id="saveRoleBtn" style="margin-top:0.5rem; width:100%;">💾 保存我的AI</button>
        </div>
        <div class="panel-section" style="flex:1; overflow-y:auto;">
          <h3>👥 AI召唤榜</h3>
          <div id="roleList" style="margin-top:0.5rem;">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 管理员隐藏弹窗 -->
  <div class="modal-overlay hidden" id="adminModal">
    <div class="modal-box">
      <h3>👑 管理员设置 (只读角色)</h3>
      <label>API Key</label>
      <input type="password" id="adminApiKey" placeholder="sk-...">
      <label>Base URL</label>
      <input type="text" id="adminBaseUrl" placeholder="https://api.deepseek.com/v1" value="https://api.deepseek.com/v1">
      <label>模型</label>
      <div class="model-row">
        <select id="adminModelSelect"></select>
        <button class="btn-small" id="fetchModelsBtn">获取模型</button>
      </div>
      <input type="text" id="adminModelManual" placeholder="或手动输入模型名" style="margin-top:0.2rem;">
      <button class="btn btn-primary" id="saveAdminBtn">💾 启动管理员</button>
      <button class="btn btn-outline" id="closeAdminBtn">取消</button>
      <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:0.5rem;">
        已有角色：<span id="adminRoleCount">0</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://llesxnxckovgoauxttjh.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_Xw2AS1s8k2TLyWGRKzwu6w_LgxivHNt';

      const ROOM_ID = 'ai_waifu_room';
      const DEEPSEEK_BASE = 'https://api.deepseek.com/v1';
      const DEEPSEEK_MODEL = 'deepseek-chat';
      const ADMIN_GESTURE = ['left','left','left','right','right','right'];
      const STORAGE_USERS = 'waifu_v2_users';
      const STORAGE_CURRENT = 'waifu_v2_current';
      const STORAGE_ADMIN = 'waifu_v2_admin';
      const STORAGE_MY_ROLE = 'waifu_v2_my_role';

      const $ = (s) => document.querySelector(s);
      const authScreen = $('#authScreen');
      const chatScreen = $('#chatScreen');
      const messagesContainer = $('#messagesContainer');
      const messageInput = $('#messageInput');
      const sendBtn = $('#sendBtn');
      const onlineCount = $('#onlineCount');
      const connectionStatus = $('#connectionStatus');
      const rightPanels = $('#rightPanels');
      const togglePanelBtn = $('#togglePanelBtn');
      const adminModal = $('#adminModal');
      const roleListDiv = $('#roleList');
      const toast = $('#toast');

      let currentUser = null;
      let isAdmin = false;
      let adminConfig = { apiKey: '', baseUrl: DEEPSEEK_BASE, model: DEEPSEEK_MODEL };
      let supabase = null;
      let messageCache = new Map();
      let allRoles = {}; // name -> { owner, persona }
      let repliedMessages = new Set();
      let channel = null;
      let roleChannel = null;

      let gestureBuf = [], gestureTimer = null;

      function showToast(msg, d=2200) {
        toast.textContent = msg; toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), d);
      }
      function getUsers() { try { return JSON.parse(localStorage.getItem(STORAGE_USERS))||{}; } catch { return {}; } }
      function saveUsers(u) { localStorage.setItem(STORAGE_USERS, JSON.stringify(u)); }
      function loadCurrentUser() { try { return JSON.parse(localStorage.getItem(STORAGE_CURRENT)); } catch { return null; } }
      function saveCurrentUser(u) { localStorage.setItem(STORAGE_CURRENT, JSON.stringify(u)); }
      function loadAdminConfig() { try { const c = JSON.parse(localStorage.getItem(STORAGE_ADMIN)); if (c) adminConfig = c; } catch {} }
      function saveAdminConfig() { localStorage.setItem(STORAGE_ADMIN, JSON.stringify(adminConfig)); }
      function loadMyRole() { try { return JSON.parse(localStorage.getItem(STORAGE_MY_ROLE)); } catch { return null; } }
      function saveMyRole(r) { localStorage.setItem(STORAGE_MY_ROLE, JSON.stringify(r)); }
      function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
      function scrollBottom(instant) {
        if (instant) messagesContainer.scrollTop = messagesContainer.scrollHeight;
        else requestAnimationFrame(() => { messagesContainer.scrollTop = messagesContainer.scrollHeight; });
      }
      function nearBottom() { return messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 90; }

      // ============ 连接状态 ============
      function setConnected(v) {
        connectionStatus.textContent = v ? '🟢 已连接' : '🔴 未连接';
        connectionStatus.className = 'connection-status ' + (v ? 'online' : 'offline');
      }

      // ============ 角色管理 ============
      async function loadRoles() {
        if (!supabase) return;
        const { data } = await supabase.from('roles').select('*');
        allRoles = {};
        if (data) data.forEach(r => { allRoles[r.name] = { owner: r.owner, persona: r.persona }; });
        updateRoleListUI();
        if (isAdmin) $('#adminRoleCount').textContent = Object.keys(allRoles).length;
      }

      function subscribeRoles() {
        roleChannel = supabase
          .channel('roles-live')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'roles' }, () => loadRoles())
          .subscribe();
      }

      async function saveRole(name, persona) {
        if (!name || !persona || !currentUser) return;
        await supabase.from('roles').upsert({
          name, owner: currentUser.username, persona, updated_at: Date.now()
        }, { onConflict: 'name' });
        saveMyRole({ name, persona });
        showToast('✅ 角色已保存');
      }

      function updateRoleListUI() {
        const names = Object.keys(allRoles);
        let html = names.length === 0 ? '<span style="color:var(--text-secondary);">暂无AI</span>' : '';
        names.forEach(name => {
          const r = allRoles[name];
          html += `<div class="role-list-item">
            <span><strong>${escapeHtml(name)}</strong> <span style="font-size:0.65rem;color:var(--text-secondary);">by ${escapeHtml(r.owner)}</span></span>
            <button class="call-btn" onclick="document.getElementById('messageInput').value+=' @${escapeHtml(name)} '; document.getElementById('messageInput').focus();">召唤</button>
          </div>`;
        });
        roleListDiv.innerHTML = html;
      }

      // ============ 消息 ============
      async function loadMessages() {
        const { data } = await supabase.from('messages').select('*').eq('room_id', ROOM_ID).order('timestamp', { ascending: true }).limit(200);
        if (data) { data.forEach(m => messageCache.set(m.id.toString(), m)); renderMessages(); scrollBottom(true); }
      }

      function subscribeMessages() {
        channel = supabase.channel('msg-live')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${ROOM_ID}` }, (payload) => {
            const msg = payload.new;
            if (!messageCache.has(msg.id.toString())) {
              messageCache.set(msg.id.toString(), msg);
              renderMessages();
              if (isAdmin && adminConfig.apiKey && msg.type === 'user') handleAI(msg, msg.id.toString());
            }
          }).subscribe();
      }

      async function sendMsg(text, type='user', extra={}) {
        if (!supabase) return;
        const { error } = await supabase.from('messages').insert([{
          room_id: ROOM_ID, sender: currentUser.username, text, type, timestamp: Date.now(),
          role_owner: extra.roleOwner || null
        }]);
        if (error) console.error(error);
      }

      // ============ AI ============
      function handleAI(msg, key) {
        const text = msg.text || '';
        const mentioned = Object.keys(allRoles).filter(name => {
          const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          return new RegExp(`@${esc}`, 'i').test(text);
        });
        mentioned.forEach(roleName => {
          const rid = key + '_' + roleName;
          if (repliedMessages.has(rid)) return;
          repliedMessages.add(rid);
          const role = allRoles[roleName];
          if (!role) return;
          callAI(role.persona, text).then(reply => {
            if (reply) sendMsg(reply, 'ai', { roleOwner: role.owner });
          });
        });
      }

      async function callAI(persona, userMsg) {
        if (!adminConfig.apiKey || !adminConfig.baseUrl) return null;
        const url = adminConfig.baseUrl.replace(/\/+$/, '') + '/chat/completions';
        try {
          const res = await fetch(url, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminConfig.apiKey}` },
            body: JSON.stringify({ model: adminConfig.model, messages: [{ role: 'system', content: persona }, { role: 'user', content: userMsg }], temperature: 0.9, max_tokens: 300 })
          });
          if (!res.ok) return null;
          const d = await res.json();
          return d.choices?.[0]?.message?.content?.trim() || null;
        } catch { return null; }
      }

      function renderMessages() {
        const wasNear = nearBottom();
        const msgs = Array.from(messageCache.values()).filter(m => m.type==='user'||m.type==='ai').sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
        let html = '';
        msgs.forEach(m => {
          const isAI = m.type === 'ai';
          const sender = m.sender || '匿名';
          const avatarChar = isAI ? '💖' : (sender.charAt(0)||'?').toUpperCase();
          const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString('zh-CN', {hour12:false}) : '';
          html += `<div class="message ${isAI?'ai':'user'}">
            <div class="avatar">${avatarChar}</div>
            <div><div class="meta"><span>${escapeHtml(sender)}</span>${isAI?'<span class="role-badge">AI</span>':''}<span>${time}</span></div>
            <div class="bubble">${escapeHtml(m.text)}</div></div></div>`;
        });
        messagesContainer.innerHTML = html || '<div class="typing-indicator">💬 聊天室空空如也</div>';
        if (wasNear) scrollBottom(true);
      }

      // ============ 初始化 ============
      function initSupabase() {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        setConnected(true);
        loadRoles();
        subscribeRoles();
        loadMessages();
        subscribeMessages();
        setInterval(() => { if (supabase && currentUser) supabase.from('presences').upsert({ username: currentUser.username, last_seen: Date.now() }, { onConflict: 'username' }).catch(()=>{}); }, 8000);
        setInterval(async () => { const { data } = await supabase.from('presences').select('username').gte('last_seen', Date.now()-15000); onlineCount.textContent = `🟢 ${data?.length||1} 在线`; }, 10000);
      }

      // ============ 登录 ============
      function login(u, p) {
        const users = getUsers();
        if (!users[u]) return '用户不存在';
        if (users[u] !== p) return '密码错误';
        currentUser = { username: u, password: p };
        saveCurrentUser(currentUser);
        afterLogin(); return null;
      }
      function register(u, p) {
        if (!u||!p) return '不能为空';
        const users = getUsers();
        if (users[u]) return '用户已存在';
        users[u] = p; saveUsers(users);
        currentUser = { username: u, password: p };
        saveCurrentUser(currentUser);
        afterLogin(); return null;
      }
      function afterLogin() {
        authScreen.classList.remove('active');
        chatScreen.classList.add('active');
        loadAdminConfig();
        isAdmin = !!adminConfig.apiKey;
        if (isAdmin) $('#adminIndicator').style.display='block'; else $('#adminIndicator').style.display='none';
        const r = loadMyRole();
        if (r) { $('#myRoleName').value = r.name||''; $('#myRolePersona').value = r.persona||''; }
        initSupabase();
        togglePanelBtn.style.display = window.innerWidth <= 768 ? 'block' : 'none';
      }
      function logout() {
        currentUser=null; isAdmin=false;
        localStorage.removeItem(STORAGE_CURRENT);
        chatScreen.classList.remove('active'); authScreen.classList.add('active');
        messageCache.clear(); allRoles={}; messagesContainer.innerHTML='';
        if (channel) supabase.removeChannel(channel);
        if (roleChannel) supabase.removeChannel(roleChannel);
        supabase=null;
      }

      // ============ 手势 ============
      document.getElementById('topBar').addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (e.button===0) gestureBuf.push('left');
        else if (e.button===2) gestureBuf.push('right');
        else return;
        clearTimeout(gestureTimer); gestureTimer = setTimeout(()=>{gestureBuf=[];},1500);
        if (gestureBuf.length >= 6) {
          const recent = gestureBuf.slice(-6);
          if (recent.join(',')===ADMIN_GESTURE.join(',')) { gestureBuf=[]; openAdmin(); }
        }
      });
      document.getElementById('topBar').addEventListener('contextmenu', e=>e.preventDefault());

      function openAdmin() {
        loadAdminConfig();
        $('#adminApiKey').value = adminConfig.apiKey;
        $('#adminBaseUrl').value = adminConfig.baseUrl;
        $('#adminModelManual').value = adminConfig.model;
        $('#adminModelSelect').innerHTML = `<option>${adminConfig.model}</option>`;
        $('#adminRoleCount').textContent = Object.keys(allRoles).length;
        adminModal.classList.remove('hidden');
      }

      // ============ 事件 ============
      document.getElementById('loginBtn').addEventListener('click', ()=>{
        const err = login($('#usernameInput').value.trim(), $('#passwordInput').value);
        if (err) $('#authError').textContent = err;
      });
      document.getElementById('registerBtn').addEventListener('click', ()=>{
        const err = register($('#usernameInput').value.trim(), $('#passwordInput').value);
        if (err) $('#authError').textContent = err;
      });
      document.getElementById('toggleToRegister').addEventListener('click', function(){
        document.querySelector('#authScreen h2').textContent='📝 注册账号';
        document.getElementById('loginBtn').style.display='none';
        document.getElementById('registerBtn').style.display='block';
        document.querySelector('#authScreen .link-text').parentNode.innerHTML='已有账号？<span class="link-text" id="toggleToLogin">立即登录</span>';
        document.getElementById('toggleToLogin').addEventListener('click', ()=>{
          document.querySelector('#authScreen h2').textContent='💖 AI老婆聊天室';
          document.getElementById('loginBtn').style.display='block';
          document.getElementById('registerBtn').style.display='none';
          document.querySelector('#authScreen .link-text').parentNode.innerHTML='没有账号？<span class="link-text" id="toggleToRegister">立即注册</span>';
          document.getElementById('toggleToRegister').addEventListener('click', arguments.callee);
        });
      });

      sendBtn.addEventListener('click', ()=>{
        const t = messageInput.value.trim();
        if (!t||!currentUser) return;
        messageInput.value='';
        sendMsg(t, 'user');
      });
      messageInput.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); sendBtn.click();} });

      togglePanelBtn.addEventListener('click', ()=> rightPanels.classList.toggle('open'));
      document.getElementById('logoutBtn').addEventListener('click', logout);

      document.getElementById('saveRoleBtn').addEventListener('click', ()=>{
        const name = $('#myRoleName').value.trim();
        const persona = $('#myRolePersona').value.trim();
        if (!name||!persona) { showToast('请填写完整'); return; }
        saveRole(name, persona);
        rightPanels.classList.add('open');
      });

      document.getElementById('fetchModelsBtn').addEventListener('click', async ()=>{
        const key = $('#adminApiKey').value.trim();
        const url = $('#adminBaseUrl').value.trim().replace(/\/+$/,'');
        if (!key||!url) { showToast('请填写Key和URL'); return; }
        try {
          const res = await fetch(`${url}/models`, { headers: { Authorization: `Bearer ${key}` } });
          const data = await res.json();
          const models = data.data||[];
          const sel = $('#adminModelSelect');
          sel.innerHTML = models.map(m=>`<option>${m.id}</option>`).join('');
          showToast(`获取 ${models.length} 个模型`);
        } catch(e) { showToast('失败'); }
      });
      document.getElementById('saveAdminBtn').addEventListener('click', ()=>{
        const key = $('#adminApiKey').value.trim();
        const url = $('#adminBaseUrl').value.trim()||DEEPSEEK_BASE;
        const model = $('#adminModelSelect').value||$('#adminModelManual').value.trim();
        if (!key||!model) { showToast('请填写完整'); return; }
        adminConfig = { apiKey: key, baseUrl: url, model };
        saveAdminConfig();
        isAdmin = true;
        adminModal.classList.add('hidden');
        showToast('👑 管理员已启动');
      });
      document.getElementById('closeAdminBtn').addEventListener('click', ()=> adminModal.classList.add('hidden'));

      // 初始加载
      const saved = loadCurrentUser();
      if (saved?.username && getUsers()[saved.username]===saved.password) {
        currentUser = saved;
        afterLogin();
      } else authScreen.classList.add('active');
    })();
  </script>
</body>
</html>
