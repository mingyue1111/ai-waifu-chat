<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>AI老婆聊天室 · AI互相召唤版</title>
  <style>
    :root {
      --bg: #1a1d23;
      --surface: #22252e;
      --surface-light: #2a2d37;
      --primary: #6c8cff;
      --primary-soft: #4a5fcf;
      --danger: #e0556a;
      --text: #e8e9ef;
      --text-secondary: #9a9da8;
      --bubble-user: #2f3b54;
      --bubble-ai: #3c1e4a;
      --border: #363a45;
      --radius: 16px;
      --radius-xs: 8px;
      --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      height: 100vh; width: 100vw; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
    .screen.active { display: flex; }

    .auth-box {
      background: var(--surface); border-radius: var(--radius);
      padding: 2.5rem 2rem; width: 90%; max-width: 400px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; gap: 1.2rem; margin: auto;
    }
    .auth-box h2 { font-size: 1.6rem; text-align: center; color: #fff; }
    .auth-box input {
      width: 100%; padding: 0.85rem; border-radius: var(--radius-xs);
      border: 1.5px solid var(--border); background: var(--surface-light);
      color: var(--text); font-size: 0.95rem; outline: none;
    }
    .auth-box input:focus { border-color: var(--primary); }
    .btn {
      padding: 0.85rem; border: none; border-radius: var(--radius-xs);
      font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s;
      letter-spacing: 0.3px; font-family: var(--font);
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-soft); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--surface-light); }
    .link-text { color: var(--primary); cursor: pointer; font-weight: 500; }
    .error-msg { color: var(--danger); font-size: 0.8rem; text-align: center; min-height: 1rem; }

    .chat-layout { flex: 1; display: flex; overflow: hidden; position: relative; }
    .main-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .top-bar {
      padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; background: var(--surface);
      cursor: default;
    }
    .top-bar .room-title { font-weight: 700; font-size: 1.1rem; flex: 1; }
    .online-count { font-size: 0.8rem; color: var(--text-secondary); background: var(--surface-light); padding: 2px 10px; border-radius: 20px; }
    .connection-status {
      font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
      background: #ff9800; color: #fff; margin-left: 4px;
    }
    .connection-status.online { background: #4caf50; }
    .connection-status.offline { background: #e0556a; }

    .right-panels {
      display: flex; flex-direction: column; width: 300px; min-width: 300px;
      border-left: 1px solid var(--border); background: var(--surface-light);
      transition: transform 0.3s ease; z-index: 20; overflow-y: auto;
    }
    @media (max-width: 768px) {
      .right-panels {
        position: fixed; top: 0; right: 0; bottom: 0; width: 85%; max-width: 320px;
        transform: translateX(100%); box-shadow: -8px 0 20px rgba(0,0,0,0.5);
      }
      .right-panels.open { transform: translateX(0); }
      .panel-close-btn { display: block !important; }
    }
    .panel-close-btn {
      display: none; position: absolute; top: 12px; right: 12px;
      background: var(--danger); color: #fff; border: none;
      width: 28px; height: 28px; border-radius: 50%; font-size: 1rem;
      cursor: pointer; z-index: 22;
    }

    .panel-section { padding: 1rem; border-bottom: 1px solid var(--border); position: relative; }
    .panel-section:last-child { border-bottom: none; flex: 1; overflow-y: auto; }

    .role-list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem;
    }
    .call-btn {
      background: var(--primary); color: #fff; border: none;
      border-radius: 12px; padding: 2px 10px; cursor: pointer; font-size: 0.7rem;
    }

    .messages-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .message { display: flex; gap: 8px; max-width: 85%; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai { align-self: flex-start; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem;
      color: #fff; flex-shrink: 0;
    }
    .message.user .avatar { background: #4a5fcf; }
    .message.ai .avatar { background: #e0557a; }
    .bubble {
      padding: 0.7rem 1rem; border-radius: 18px; font-size: 0.92rem;
      line-height: 1.5; word-break: break-word;
      background: var(--bubble-user); color: #dfe3f0;
    }
    .message.ai .bubble { background: var(--bubble-ai); color: #f8e0ff; }
    .meta { font-size: 0.65rem; color: var(--text-secondary); margin: 0 0.2rem; display: flex; gap: 6px; align-items: center; }
    .message.user .meta { justify-content: flex-end; }
    .typing-indicator { font-size: 0.8rem; color: var(--text-secondary); font-style: italic; padding: 0.5rem; }

    .input-area { padding: 0.8rem 1rem; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--surface); }
    .input-area textarea {
      flex: 1; background: var(--surface-light); border: 1.5px solid var(--border);
      border-radius: 24px; padding: 0.65rem 1.2rem; color: var(--text);
      font-size: 0.9rem; resize: none; outline: none; max-height: 110px; font-family: var(--font);
    }
    .input-area textarea:focus { border-color: var(--primary); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%; background: var(--primary);
      border: none; color: #fff; font-size: 1.2rem; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .send-btn:hover { background: var(--primary-soft); }
    .send-btn:disabled { background: #444; cursor: not-allowed; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 50;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--surface); border-radius: var(--radius); padding: 2rem;
      width: 90%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    }
    .modal-box h3 { font-size: 1.2rem; color: #fff; }
    .model-row { display: flex; gap: 0.5rem; align-items: flex-end; }
    .model-row select { flex: 1; }

    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 0.7rem 1.5rem; border-radius: 20px;
      font-size: 0.85rem; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .overlay-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.3); z-index: 19; display: none;
    }
    @media (max-width: 768px) { .overlay-bg.active { display: block; } }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="screen active" id="authScreen">
    <div class="auth-box">
      <h2>💖 AI老婆聊天室</h2>
      <p style="text-align:center; color:var(--text-secondary);">创建专属AI · 群聊记忆 · AI可互相召唤</p>
      <input type="text" id="usernameInput" placeholder="用户名" maxlength="15">
      <input type="password" id="passwordInput" placeholder="密码" maxlength="30">
      <div class="error-msg" id="authError"></div>
      <button class="btn btn-primary" id="loginBtn">登 录</button>
      <button class="btn btn-outline" id="registerBtn">注 册</button>
      <div style="text-align:center; font-size:0.85rem;">
        没有账号？<span class="link-text" id="toggleToRegister">立即注册</span>
      </div>
    </div>
  </div>

  <div class="screen" id="chatScreen">
    <div class="chat-layout">
      <div class="main-panel">
        <div class="top-bar" id="topBar">
          <span class="room-title">🌐 AI老婆聊天室</span>
          <span class="connection-status online" id="connectionStatus">🟢 已连接</span>
          <span class="online-count" id="onlineCount">🟢 在线</span>
          <button class="btn-small" id="togglePanelBtn" style="display:none;">👥</button>
          <button class="btn-small" id="logoutBtn">🚪</button>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
          <textarea id="messageInput" rows="1" placeholder="输入消息，@AI名字召唤老婆~" maxlength="800"></textarea>
          <button class="send-btn" id="sendBtn">➤</button>
        </div>
      </div>
      <div class="right-panels" id="rightPanels">
        <button class="panel-close-btn" id="panelCloseBtn">✕</button>
        <div class="panel-section">
          <h3>💖 我的AI</h3>
          <input type="text" id="myRoleName" placeholder="角色名" maxlength="10" style="width:100%; margin:0.5rem 0; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.5rem; color:var(--text);">
          <textarea id="myRolePersona" rows="2" placeholder="人设（例如：温柔可爱的女友，喜欢用颜文字）" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.5rem; color:var(--text); resize:vertical;"></textarea>
          <button class="btn-small" id="saveRoleBtn" style="margin-top:0.5rem; width:100%;">💾 保存我的AI</button>
        </div>
        <div class="panel-section" style="flex:1; overflow-y:auto;">
          <h3>👥 AI召唤榜</h3>
          <div id="roleList" style="margin-top:0.5rem;">加载中...</div>
        </div>
      </div>
    </div>
    <div class="overlay-bg" id="overlayBg"></div>
  </div>

  <div class="modal-overlay hidden" id="adminModal">
    <div class="modal-box">
      <h3>👑 管理员设置</h3>
      <label>API Key</label>
      <input type="password" id="adminApiKey" placeholder="sk-...">
      <label>Base URL</label>
      <input type="text" id="adminBaseUrl" placeholder="https://api.deepseek.com/v1" value="https://api.deepseek.com/v1">
      <label>模型</label>
      <div class="model-row">
        <select id="adminModelSelect"></select>
        <button class="btn-small" id="fetchModelsBtn">获取模型</button>
      </div>
      <input type="text" id="adminModelManual" placeholder="或手动输入模型名" style="margin-top:0.2rem;">
      <button class="btn btn-primary" id="saveAdminBtn">💾 启动管理员</button>
      <button class="btn btn-outline" id="closeAdminBtn">取消</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://llesxnxckovgoauxttjh.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_Xw2AS1s8k2TLyWGRKzwu6w_LgxivHNt';
      const ROOM_ID = 'ai_waifu_room';
      const DEEPSEEK_BASE = 'https://api.deepseek.com/v1';
      const DEEPSEEK_MODEL = 'deepseek-chat';
      const ADMIN_GESTURE = ['left','left','left','right','right','right'];

      function getEl(id) { return document.getElementById(id); }
      function qs(sel) { return document.querySelector(sel); }

      const authScreen = getEl('authScreen');
      const chatScreen = getEl('chatScreen');
      const messagesContainer = getEl('messagesContainer');
      const messageInput = getEl('messageInput');
      const sendBtn = getEl('sendBtn');
      const onlineCount = getEl('onlineCount');
      const connectionStatus = getEl('connectionStatus');
      const rightPanels = getEl('rightPanels');
      const togglePanelBtn = getEl('togglePanelBtn');
      const panelCloseBtn = getEl('panelCloseBtn');
      const overlayBg = getEl('overlayBg');
      const adminModal = getEl('adminModal');
      const roleListDiv = getEl('roleList');
      const toast = getEl('toast');

      let currentUser = null;
      let isAdmin = false;
      let adminConfig = { apiKey: '', baseUrl: DEEPSEEK_BASE, model: DEEPSEEK_MODEL };
      let supabase = null;
      let messageCache = new Map();
      let allRoles = {};
      let repliedMessages = new Set();
      let channel = null, roleChannel = null;
      let gestureBuf = [], gestureTimer = null;

      function showToast(msg, d=2200) {
        if (!toast) return;
        toast.textContent = msg; toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), d);
      }

      function getUsers() { try { return JSON.parse(localStorage.getItem('waifu_v9_users'))||{}; } catch { return {}; } }
      function saveUsers(u) { localStorage.setItem('waifu_v9_users', JSON.stringify(u)); }
      function loadCurrentUser() { try { return JSON.parse(localStorage.getItem('waifu_v9_current')); } catch { return null; } }
      function saveCurrentUser(u) { localStorage.setItem('waifu_v9_current', JSON.stringify(u)); }
      function loadAdminConfig() { try { const c = JSON.parse(localStorage.getItem('waifu_v9_admin')); if (c) adminConfig = c; } catch {} }
      function saveAdminConfig() { localStorage.setItem('waifu_v9_admin', JSON.stringify(adminConfig)); }
      function loadMyRole() { try { return JSON.parse(localStorage.getItem('waifu_v9_my_role')); } catch { return null; } }
      function saveMyRole(r) { localStorage.setItem('waifu_v9_my_role', JSON.stringify(r)); }
      function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

      function scrollBottom(instant) {
        if (!messagesContainer) return;
        if (instant) messagesContainer.scrollTop = messagesContainer.scrollHeight;
        else requestAnimationFrame(() => { messagesContainer.scrollTop = messagesContainer.scrollHeight; });
      }
      function nearBottom() {
        if (!messagesContainer) return false;
        return messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 90;
      }
      function setConnected(v) {
        if (!connectionStatus) return;
        connectionStatus.textContent = v ? '🟢 已连接' : '🔴 未连接';
        connectionStatus.className = 'connection-status ' + (v ? 'online' : 'offline');
      }

      function openPanel() { rightPanels?.classList.add('open'); overlayBg?.classList.add('active'); }
      function closePanel() { rightPanels?.classList.remove('open'); overlayBg?.classList.remove('active'); }
      if (togglePanelBtn) togglePanelBtn.addEventListener('click', () => rightPanels?.classList.contains('open') ? closePanel() : openPanel());
      if (panelCloseBtn) panelCloseBtn.addEventListener('click', closePanel);
      if (overlayBg) overlayBg.addEventListener('click', closePanel);

      // ============ Supabase ============
      async function initSupabase() {
        try {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          setConnected(true);
          await loadRoles();
          subscribeRoles();
          await loadMessages();
          subscribeMessages();
          startPresence();
        } catch (e) {
          console.error('初始化失败:', e);
          setConnected(false);
          if (roleListDiv) roleListDiv.innerHTML = '<span style="color:red;">连接失败，请刷新</span>';
        }
      }

      async function loadRoles() {
        if (!supabase) return;
        try {
          const { data } = await supabase.from('roles').select('*');
          allRoles = {};
          if (data) data.forEach(r => allRoles[r.name] = { owner: r.owner, persona: r.persona });
          updateRoleListUI();
        } catch (e) {
          console.error('加载角色失败:', e);
          if (roleListDiv) roleListDiv.innerHTML = '<span style="color:red;">加载失败</span>';
        }
      }
      function subscribeRoles() {
        if (!supabase) return;
        roleChannel = supabase.channel('roles-live')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'roles' }, () => loadRoles())
          .subscribe();
      }

      async function saveRole(name, persona) {
        if (!supabase) { showToast('系统未就绪'); return; }
        if (!name || !persona || !currentUser) { showToast('请填写完整'); return; }
        try {
          await supabase.from('roles').upsert({
            name, owner: currentUser.username, persona, updated_at: Date.now()
          }, { onConflict: 'name' });
          saveMyRole({ name, persona });
          showToast('✅ 角色已保存');
        } catch (e) {
          console.error(e);
          showToast('保存失败: ' + (e.message || '未知错误'));
        }
      }

      function updateRoleListUI() {
        if (!roleListDiv) return;
        const names = Object.keys(allRoles);
        if (names.length === 0) {
          roleListDiv.innerHTML = '<span style="color:var(--text-secondary);">暂无AI角色</span>';
        } else {
          let html = '';
          names.forEach(name => {
            const r = allRoles[name];
            html += `<div class="role-list-item">
              <span><strong>${escapeHtml(name)}</strong> <span style="font-size:0.65rem;color:var(--text-secondary);">by ${escapeHtml(r.owner)}</span></span>
              <button class="call-btn" onclick="(function(){var el=document.getElementById('messageInput');if(el){el.value+=' @${escapeHtml(name).replace(/'/g, "\\'")} ';el.focus();}})()">召唤</button>
            </div>`;
          });
          roleListDiv.innerHTML = html;
        }
      }

      // ============ 消息发送 ============
      async function sendMsg(text, type, senderOverride, extra={}) {
        if (!supabase) return;
        const sender = senderOverride || (currentUser ? currentUser.username : '匿名');
        try {
          await supabase.from('messages').insert([{
            room_id: ROOM_ID, sender, text, type, timestamp: Date.now(),
            role_owner: extra.roleOwner || null
          }]);
        } catch (e) { console.error('发送失败:', e); }
      }

      async function loadMessages() {
        if (!supabase) return;
        try {
          const { data } = await supabase.from('messages').select('*').eq('room_id', ROOM_ID).order('timestamp', { ascending: true }).limit(200);
          messageCache.clear();
          if (data) data.forEach(m => messageCache.set(m.id.toString(), m));
          renderMessages();
          scrollBottom(true);
        } catch (e) { console.error('加载消息失败:', e); }
      }

      function subscribeMessages() {
        if (!supabase) return;
        channel = supabase.channel('msg-live')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${ROOM_ID}` }, (payload) => {
            const msg = payload.new;
            if (!messageCache.has(msg.id.toString())) {
              messageCache.set(msg.id.toString(), msg);
              renderMessages();
              // 关键修复：允许用户消息和AI消息都触发召唤
              if (isAdmin && adminConfig.apiKey && (msg.type === 'user' || msg.type === 'ai')) {
                handleAI(msg, msg.id.toString());
              }
            }
          }).subscribe();
      }

      // ============ AI 处理（记忆+AI互相召唤） ============
      async function getRecentHistory(currentMsgId, count = 30) {
        if (!supabase) return [];
        try {
          const { data } = await supabase
            .from('messages')
            .select('*')
            .eq('room_id', ROOM_ID)
            .order('timestamp', { ascending: false })
            .limit(count);
          if (!data) return [];
          const filtered = data.filter(m => m.id.toString() !== currentMsgId && (m.type === 'user' || m.type === 'ai'));
          const recent = filtered.reverse();
          return recent.map(m => {
            const prefix = m.type === 'ai' ? `${m.sender} (AI):` : `${m.sender}:`;
            return { role: m.type === 'user' ? 'user' : 'assistant', content: `${prefix} ${m.text}` };
          });
        } catch (e) {
          console.error('获取历史失败:', e);
          return [];
        }
      }

      function buildOtherRolesDescription(currentRoleName) {
        const others = Object.keys(allRoles).filter(name => name !== currentRoleName);
        if (others.length === 0) return '';
        let desc = '当前聊天室中还有以下角色：\n';
        others.forEach(name => {
          const role = allRoles[name];
          desc += `- ${name}: ${role.persona}\n`;
        });
        return desc;
      }

      async function handleAI(msg, key) {
        const text = msg.text || '';
        const mentioned = Object.keys(allRoles).filter(name => {
          const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          return new RegExp(`@${esc}`, 'i').test(text);
        });
        mentioned.forEach(async (roleName) => {
          const rid = key + '_' + roleName;
          if (repliedMessages.has(rid)) return;
          repliedMessages.add(rid);
          const role = allRoles[roleName];
          if (!role) return;

          const history = await getRecentHistory(key, 30);
          const otherRolesDesc = buildOtherRolesDescription(roleName);

          const systemPrompt = `你是${roleName}。你的详细人设如下：\n${role.persona}\n\n请完全融入这个角色。用第一人称、符合人设的语气说话。只输出最终对话内容，不要有任何额外解释或括号动作描述。\n\n${otherRolesDesc}\n\n【最重要的规则】你必须记住聊天记录中最近发生的事。你能够看到之前的全部对话，请在回复中自然地引用和延续之前的记忆。如果上一轮你们在讨论某件事，请继续那个话题，不要像第一次见面一样。展示出你有长期记忆。`;

          const messages = [
            { role: 'system', content: systemPrompt },
            ...history,
            { role: 'user', content: `${msg.sender}: ${text}` }
          ];

          console.log(`🤖 调用 ${roleName} 的消息列表：`, messages);

          const reply = await callAI(messages);
          if (reply) {
            sendMsg(reply, 'ai', roleName, { roleOwner: role.owner });
          }
        });
      }

      async function callAI(messages) {
        if (!adminConfig.apiKey || !adminConfig.baseUrl) return null;
        const url = adminConfig.baseUrl.replace(/\/+$/, '') + '/chat/completions';
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminConfig.apiKey}` },
            body: JSON.stringify({
              model: adminConfig.model,
              messages: messages,
              temperature: 0.9,
              max_tokens: 500
            })
          });
          if (!res.ok) {
            console.error('API调用失败：', res.status, await res.text());
            return null;
          }
          const d = await res.json();
          return d.choices?.[0]?.message?.content?.trim() || null;
        } catch (e) {
          console.error('调用异常:', e);
          return null;
        }
      }

      function renderMessages() {
        if (!messagesContainer) return;
        const wasNear = nearBottom();
        const msgs = Array.from(messageCache.values())
          .filter(m => m.type==='user'||m.type==='ai')
          .sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
        let html = '';
        msgs.forEach(m => {
          const isAI = m.type === 'ai';
          const sender = m.sender || '匿名';
          const avatarChar = isAI ? '💖' : (sender.charAt(0)||'?').toUpperCase();
          const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString('zh-CN', {hour12:false}) : '';
          html += `<div class="message ${isAI?'ai':'user'}">
            <div class="avatar">${avatarChar}</div>
            <div><div class="meta"><span>${escapeHtml(sender)}</span>${isAI?'<span class="role-badge">AI</span>':''}<span>${time}</span></div>
            <div class="bubble">${escapeHtml(m.text)}</div></div></div>`;
        });
        messagesContainer.innerHTML = html || '<div class="typing-indicator">💬 聊天室空空如也</div>';
        if (wasNear) scrollBottom(true);
      }

      function startPresence() {
        setInterval(async () => {
          if (!supabase || !currentUser) return;
          try { await supabase.from('presences').upsert({ username: currentUser.username, last_seen: Date.now() }, { onConflict: 'username' }); } catch {}
        }, 8000);
        setInterval(async () => {
          if (!supabase || !onlineCount) return;
          try {
            const { data } = await supabase.from('presences').select('username').gte('last_seen', Date.now()-15000);
            onlineCount.textContent = `🟢 ${data?.length||1} 在线`;
          } catch {}
        }, 10000);
      }

      // ============ 登录/注册 ============
      function login(u, p) {
        const users = getUsers();
        if (!users[u]) return '用户不存在';
        if (users[u] !== p) return '密码错误';
        currentUser = { username: u, password: p };
        saveCurrentUser(currentUser);
        afterLogin();
        return null;
      }
      function register(u, p) {
        if (!u||!p) return '不能为空';
        const users = getUsers();
        if (users[u]) return '用户已存在';
        users[u] = p; saveUsers(users);
        currentUser = { username: u, password: p };
        saveCurrentUser(currentUser);
        afterLogin();
        return null;
      }
      function afterLogin() {
        authScreen.classList.remove('active');
        chatScreen.classList.add('active');
        loadAdminConfig();
        isAdmin = !!adminConfig.apiKey;
        const r = loadMyRole();
        const nameEl = getEl('myRoleName');
        const personaEl = getEl('myRolePersona');
        if (r && nameEl) nameEl.value = r.name || '';
        if (r && personaEl) personaEl.value = r.persona || '';
        initSupabase();
        if (togglePanelBtn) togglePanelBtn.style.display = window.innerWidth <= 768 ? 'block' : 'none';
      }
      function logout() {
        currentUser=null; isAdmin=false;
        localStorage.removeItem('waifu_v9_current');
        chatScreen.classList.remove('active'); authScreen.classList.add('active');
        messageCache.clear(); allRoles={};
        if (messagesContainer) messagesContainer.innerHTML='';
        if (channel && supabase) supabase.removeChannel(channel);
        if (roleChannel && supabase) supabase.removeChannel(roleChannel);
        supabase=null;
      }

      // ============ 手势 ============
      const topBarEl = getEl('topBar');
      if (topBarEl) {
        topBarEl.addEventListener('mousedown', (e) => {
          e.preventDefault();
          if (e.button===0) gestureBuf.push('left');
          else if (e.button===2) gestureBuf.push('right');
          else return;
          clearTimeout(gestureTimer);
          gestureTimer = setTimeout(()=>{gestureBuf=[];},1500);
          if (gestureBuf.length >= 6 && gestureBuf.slice(-6).join(',')===ADMIN_GESTURE.join(',')) {
            gestureBuf=[];
            loadAdminConfig();
            getEl('adminApiKey') && (getEl('adminApiKey').value = adminConfig.apiKey);
            getEl('adminBaseUrl') && (getEl('adminBaseUrl').value = adminConfig.baseUrl);
            getEl('adminModelManual') && (getEl('adminModelManual').value = adminConfig.model);
            getEl('adminModelSelect') && (getEl('adminModelSelect').innerHTML = `<option>${adminConfig.model}</option>`);
            adminModal.classList.remove('hidden');
          }
        });
        topBarEl.addEventListener('contextmenu', e=>e.preventDefault());
      }

      // ============ 事件 ============
      getEl('loginBtn')?.addEventListener('click', ()=>{
        const err = login(getEl('usernameInput')?.value?.trim()||'', getEl('passwordInput')?.value||'');
        if (err) { const ae = getEl('authError'); if (ae) ae.textContent = err; }
        else { const ae = getEl('authError'); if (ae) ae.textContent = ''; }
      });
      getEl('registerBtn')?.addEventListener('click', ()=>{
        const err = register(getEl('usernameInput')?.value?.trim()||'', getEl('passwordInput')?.value||'');
        if (err) { const ae = getEl('authError'); if (ae) ae.textContent = err; }
        else { const ae = getEl('authError'); if (ae) ae.textContent = ''; }
      });
      getEl('toggleToRegister')?.addEventListener('click', function(){
        const h2 = qs('#authScreen h2');
        const loginBtn = getEl('loginBtn');
        const registerBtn = getEl('registerBtn');
        if (h2) h2.textContent='📝 注册账号';
        if (loginBtn) loginBtn.style.display='none';
        if (registerBtn) registerBtn.style.display='block';
        const p = qs('#authScreen .link-text')?.parentNode;
        if (p) p.innerHTML='已有账号？<span class="link-text" id="toggleToLogin">立即登录</span>';
        getEl('toggleToLogin')?.addEventListener('click', function(){
          if (h2) h2.textContent='💖 AI老婆聊天室';
          if (loginBtn) loginBtn.style.display='block';
          if (registerBtn) registerBtn.style.display='none';
          if (p) p.innerHTML='没有账号？<span class="link-text" id="toggleToRegister">立即注册</span>';
          getEl('toggleToRegister')?.addEventListener('click', arguments.callee);
        });
      });

      sendBtn?.addEventListener('click', ()=>{
        const t = messageInput?.value?.trim();
        if (!t||!currentUser) return;
        if (messageInput) messageInput.value='';
        sendMsg(t, 'user');
      });
      messageInput?.addEventListener('keydown', e=>{
        if (e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendBtn?.click(); }
      });

      getEl('logoutBtn')?.addEventListener('click', logout);
      getEl('saveRoleBtn')?.addEventListener('click', ()=>{
        const name = getEl('myRoleName')?.value?.trim();
        const persona = getEl('myRolePersona')?.value?.trim();
        if (!name||!persona) { showToast('请填写完整'); return; }
        saveRole(name, persona);
      });
      getEl('fetchModelsBtn')?.addEventListener('click', async ()=>{
        const key = getEl('adminApiKey')?.value?.trim();
        const url = getEl('adminBaseUrl')?.value?.trim()?.replace(/\/+$/,'');
        if (!key||!url) { showToast('请填写Key和URL'); return; }
        try {
          const res = await fetch(`${url}/models`, { headers: { Authorization: `Bearer ${key}` } });
          const data = await res.json();
          const models = data.data||[];
          const sel = getEl('adminModelSelect');
          if (sel) sel.innerHTML = models.map(m=>`<option>${m.id}</option>`).join('');
          showToast(`获取 ${models.length} 个模型`);
        } catch(e) { showToast('获取失败'); }
      });
      getEl('saveAdminBtn')?.addEventListener('click', ()=>{
        const key = getEl('adminApiKey')?.value?.trim();
        const url = (getEl('adminBaseUrl')?.value?.trim()||DEEPSEEK_BASE).replace(/\/+$/,'');
        const model = getEl('adminModelSelect')?.value||getEl('adminModelManual')?.value?.trim();
        if (!key||!model) { showToast('请填写完整'); return; }
        adminConfig = { apiKey: key, baseUrl: url, model };
        saveAdminConfig();
        isAdmin = true;
        adminModal.classList.add('hidden');
        showToast('👑 管理员已启动');
      });
      getEl('closeAdminBtn')?.addEventListener('click', ()=> adminModal.classList.add('hidden'));

      // 自动登录
      const saved = loadCurrentUser();
      if (saved?.username && getUsers()[saved.username]===saved.password) {
        currentUser = saved;
        afterLogin();
      } else {
        authScreen.classList.add('active');
      }
    })();
  </script>
</body>
</html>
